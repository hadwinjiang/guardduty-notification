AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GuardDuty findings -> EventBridge -> Lambda -> WeCom (企业微信) group robot

Parameters:
  WebhookUrl:
    Type: String
    NoEcho: true
    Description: 企业微信群机器人 Webhook URL（https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=...）
    AllowedPattern: "^https://qyapi\\.weixin\\.qq\\.com/cgi-bin/webhook/send\\?key=[A-Za-z0-9-]+$"
  MinSeverity:
    Type: Number
    Default: 4
    MinValue: 0
    MaxValue: 10
    Description: 推送的最低严重度（4=Medium及以上, 7=High及以上）
  MentionMobiles:
    Type: String
    Default: ""
    Description: 高危告警 @ 的手机号（逗号分隔，留空不 @，@all 为全员）
  MentionMinSeverity:
    Type: Number
    Default: 7
    Description: 触发 @ 的最低严重度

  ReservedConcurrency:
    Type: Number
    Default: 5
    Description: Lambda 预留并发（限制对机器人的并发请求）；账号并发配额较低（如新账号只有 10）时填 0 表示不预留

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  NotifyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # 14 天
      SqsManagedSseEnabled: true

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.lambda_handler
      CodeUri: src/
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]   # 机器人限流 20 条/分钟
      Environment:
        Variables:
          WEBHOOK_URL: !Ref WebhookUrl
          MENTION_MOBILES: !Ref MentionMobiles
          MENTION_MIN_SEVERITY: !Ref MentionMinSeverity
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt NotifyDLQ.Arn
      Events:
        GuardDutyFinding:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.guardduty]
              detail-type: [GuardDuty Finding]
              detail:
                severity: [{ numeric: [">=", !Ref MinSeverity] }]
            RetryPolicy:
              MaximumRetryAttempts: 10
              MaximumEventAgeInSeconds: 3600

  NotifyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${NotifyFunction}
      RetentionInDays: 90

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: GuardDuty -> WeCom 推送失败（消息进入 DLQ），请检查 webhook 或网络
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotifyDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionName:
    Value: !Ref NotifyFunction
  DLQUrl:
    Value: !Ref NotifyDLQ
